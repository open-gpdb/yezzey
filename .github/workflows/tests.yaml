name: Pull request

on:
  pull_request:
    branches: "*"
  push:
    branches:
      - "v*"
jobs:
  test:
    name: Run tests
    runs-on: ubuntu-20.04
    steps:

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Check out code
        uses: actions/checkout@v3
        with:
          repository: open-gpdb/gpdb
          ref: OPENGPDB_STABLE

      - name: set PR ref
        if: ${{github.event_name == 'pull_request'}}
        run: echo "GITHUB_REF=${{github.head_ref}}" >> $GITHUB_ENV

      - name: set push ref
        if: ${{github.event_name == 'push'}}
        run: echo "GITHUB_REF=${{github.ref_name}}" >> $GITHUB_ENV

      - name: Setup S3
        run: |
          docker network create -d bridge yezzey_test_network
          docker run -p 9000:9000 \
                      -p 9001:9001 \
                      --name s3_gpyezzey \
                      --network yezzey_test_network \
                      -d -e "MINIO_ROOT_USER=${{secrets.ACCESS_KEY_ID}}" \
                      -e "MINIO_ROOT_PASSWORD=${{secrets.SECRET_ACCESS_KEY}}" \
                      quay.io/minio/minio server /data
          docker exec s3_gpyezzey mc alias set myminio http://localhost:9000 ${{secrets.ACCESS_KEY_ID}} ${{secrets.SECRET_ACCESS_KEY}}
          docker exec s3_gpyezzey mc mb myminio/test-bucket-yezzey

      - name: Build docker image
        uses: docker/build-push-action@v2
        with:
          file: docker/yezzey/Dockerfile
          context: .
          push: false
          load: true
          tags: yezzey:1.0
          build-args: |
            accessKeyId=${{secrets.ACCESS_KEY_ID}}
            secretAccessKey=${{secrets.SECRET_ACCESS_KEY}}
            bucketName=test-bucket-yezzey
            yezzeyRef=${{env.GITHUB_REF}}
            s3endpoint=http:\\/\\/$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' s3_gpyezzey):9000

      - name: Run Docker
        shell: bash
        run: |
          docker run yezzey:1.0

