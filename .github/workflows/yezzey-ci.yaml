# --------------------------------------------------------------------
# Yezzey CI Pipeline
#
# All job logic lives in devops/ci/steps/*.sh, invoked from
# devops/ci/entrypoint.sh. The workflow only:
#   1. checks out the relevant repos,
#   2. brings up the MinIO service container,
#   3. runs the entrypoint with the right ENGINE/PIPELINE env.
#
# The same entrypoint is used by `make ci-integration` locally, so CI and
# local docker runs share one code path.
# --------------------------------------------------------------------
name: Yezzey CI Pipeline

on:
  push:
    branches: [ v1.8_opengpdb, master ]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CLOUDBERRY_VERSION: "REL_2_STABLE"
  CLOUDBERRY_VERSION_3: "main"
  GPDB_VERSION: "OPENGPDB_STABLE"

jobs:

  ## Stage 0: Fast standalone checks (no cluster required)

  format:
    name: clang-format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make -f Makefile.fmt check-format

  clang-tidy:
    name: clang-tidy (const-correctness)
    runs-on: ubuntu-latest
    container:
      image: silkeh/clang:16
    steps:
      - uses: actions/checkout@v4
        with: { path: yezzey }
      - name: Run clang-tidy
        working-directory: yezzey
        run: devops/ci/steps/clang-tidy.sh
        env:
          YEZZEY_SRC_DIR: ${{ github.workspace }}/yezzey
          WORKSPACE: ${{ github.workspace }}

  unit-tests:
    name: Unit Tests (googletest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: yezzey }
      - name: Build and run unit tests
        working-directory: yezzey
        run: devops/ci/steps/unit-tests.sh
        env:
          YEZZEY_SRC_DIR: ${{ github.workspace }}/yezzey
          WORKSPACE: ${{ github.workspace }}

  unit-tests-sanitizers:
    name: Unit Tests (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: yezzey }
      - name: Build and run unit tests under sanitizers
        working-directory: yezzey
        run: devops/ci/steps/unit-tests.sh
        env:
          YEZZEY_SRC_DIR: ${{ github.workspace }}/yezzey
          WORKSPACE: ${{ github.workspace }}
          SANITIZE: "1"

  ## Stage 1: Integration matrix (Cloudberry 2, Cloudberry 3, GPDB)
  #
  # One parameterised job replaces three near-identical copies. The matrix
  # drives ENGINE + the checkout ref + the build image. All step logic is
  # shared via devops/ci/entrypoint.sh.

  integration:
    name: ${{ matrix.display-name }}
    needs: [clang-tidy, unit-tests, unit-tests-sanitizers]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: cloudberry2
            display-name: Cloudberry 2.x
            db_repo: open-gpdb/cloudberry
            db_ref: REL_2_STABLE
            db_src: cloudberry
            image: apache/incubator-cloudberry:cbdb-build-ubuntu22.04-latest
            devops_repo: ""
            regress: ""
          - engine: cloudberry3
            display-name: Cloudberry 3.x
            db_repo: open-gpdb/cloudberry
            db_ref: main
            db_src: cloudberry
            image: apache/incubator-cloudberry:cbdb-build-ubuntu22.04-latest
            devops_repo: ""
            regress: simple_cbdb
          - engine: gpdb
            display-name: GPDB
            db_repo: open-gpdb/gpdb
            db_ref: OPENGPDB_STABLE
            db_src: gpdb
            image: ghcr.io/open-gpdb/gpdb-env:jammy-latest
            devops_repo: open-gpdb/gpdb-devops
            regress: ""

    container:
      image: ${{ matrix.image }}
      options: >-
        --user root
        -h cdw
        -v /usr/share:/host_usr_share
        -v /usr/local:/host_usr_local
        -v /opt:/host_opt

    services:
      minio:
        image: lazybit/minio
        ports:
          - 9000:9000
          - 9001:9001
        env:
          MINIO_ROOT_USER: some_key
          MINIO_ROOT_PASSWORD: some_key
        options: >-
          --name minio
          --health-cmd "curl --fail http://localhost:9000/minio/health/live"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        volumes:
          - ${{ github.workspace }}/data:/data

    env:
      ENGINE: ${{ matrix.engine }}
      DB_REPO: ${{ matrix.db_repo }}
      DB_REF: ${{ matrix.db_ref }}
      DB_SRC_DIR_NAME: ${{ matrix.db_src }}
      REGRESS_TARGET: ${{ matrix.regress }}

    steps:
      - name: Checkout Yezzey source
        uses: actions/checkout@v4
        with: { path: yezzey }

      - name: Checkout DB source
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.db_repo }}
          ref: ${{ matrix.db_ref }}
          path: ${{ matrix.db_src }}
          submodules: true

      - name: Checkout Yproxy source
        uses: actions/checkout@v4
        with:
          repository: open-gpdb/yproxy
          ref: master
          path: yproxy

      - name: Checkout CI Build/Test Scripts (GPDB only)
        if: ${{ matrix.devops_repo != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.devops_repo }}
          ref: main
          path: gpdb-devops
          fetch-depth: 1

      - name: Run CI pipeline (${{ matrix.engine }})
        working-directory: yezzey
        run: devops/ci/entrypoint.sh
        env:
          PIPELINE: integration
          WORKSPACE: ${{ github.workspace }}
          YEZZEY_SRC_DIR: ${{ github.workspace }}/yezzey
          DB_SRC_DIR: ${{ github.workspace }}/${{ matrix.db_src }}
          YPROXY_SRC_DIR: ${{ github.workspace }}/yproxy
          DEVOPS_DIR: ${{ github.workspace }}/gpdb-devops
          LOGS_DIR: ${{ github.workspace }}/build-logs
          SKIP_CLONE: "1"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.engine }}-${{ github.run_id }}
          path: build-logs/
          retention-days: 7

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.engine }}-${{ github.run_id }}
          path: |
            artifacts/
            **/regression.out
            **/regression.diffs
            **/results/
          retention-days: 7
          if-no-files-found: ignore

  ## ======================================================================
  ## Job: report
  ## ======================================================================

  report:
    name: Pipeline Report
    needs: [clang-tidy, unit-tests, unit-tests-sanitizers, integration]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Yezzey source
        uses: actions/checkout@v4
        with: { path: yezzey }
      - name: Cleanup containers
        if: always()
        working-directory: yezzey
        run: docker compose -f devops/build/docker/docker-compose.ci.yaml down -v --remove-orphans || true
      - name: Generate Final Report
        run: |
          {
            echo "# Yezzey Test Pipeline Report"
            echo "## Job Status"
            echo "- clang-tidy: ${{ needs.clang-tidy.result }}"
            echo "- unit-tests: ${{ needs.unit-tests.result }}"
            echo "- unit-tests-sanitizers: ${{ needs.unit-tests-sanitizers.result }}"
            echo "- integration (matrix): ${{ needs.integration.result }}"
            echo "- Completion Time: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"

            if [[ "${{ needs.clang-tidy.result }}" == "success" \
               && "${{ needs.unit-tests.result }}" == "success" \
               && "${{ needs.unit-tests-sanitizers.result }}" == "success" \
               && "${{ needs.integration.result }}" == "success" ]]; then
              echo "Pipeline completed successfully"
            else
              echo "Pipeline completed with failures"
              [[ "${{ needs.clang-tidy.result }}" != "success" ]] && echo "### clang-tidy failed"
              [[ "${{ needs.unit-tests.result }}" != "success" ]] && echo "### unit-tests failed"
              [[ "${{ needs.unit-tests-sanitizers.result }}" != "success" ]] && echo "### sanitizers failed"
              [[ "${{ needs.integration.result }}" != "success" ]] && echo "### integration failed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify on failure
        if: ${{ needs.clang-tidy.result != 'success' || needs.unit-tests.result != 'success' || needs.unit-tests-sanitizers.result != 'success' || needs.integration.result != 'success' }}
        run: |
          echo "::error::Build/Test pipeline failed!"
          echo "Timestamp: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
