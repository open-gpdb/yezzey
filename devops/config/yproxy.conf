socket_path: "/tmp/yproxy.sock"
interconnect_socket_path: "/tmp/ic.sock"
log_level: debug
debug_port: 2113
debug_minutes: 120

storage:
  access_key_id: "$AWS_ACCESS_KEY_ID"
  secret_access_key: "$AWS_SECRET_ACCESS_KEY"
  storage_endpoint: "$AWS_ENDPOINT"
  storage_prefix: ""
  storage_bucket: "gpyezzey"
  storage_region: "us-west-2"
  storage_type: "s3"
  tablespace_map:
    "pg_default": "gpyezzey"
    "tab1": "gpyezzey"
    "tab2": "gpyezzey"

backup_storage:
  access_key_id: "$AWS_ACCESS_KEY_ID"
  secret_access_key: "$AWS_SECRET_ACCESS_KEY"
  storage_endpoint: "$AWS_ENDPOINT"
  storage_prefix: ""
  storage_bucket: "gpyezzey"
  storage_region: "us-west-2"
  storage_type: "s3"

vacuum:
  protection_window: 0s
